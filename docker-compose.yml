services:
  flourish-backend:
    container_name: flourish-backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080"
    env_file:
      - ./backend/.env
    networks:
      - flourish-network

  flourish-frontend:
    container_name: flourish-frontend
    restart: always
    build:
      context: ./flourishn
      dockerfile: Dockerfile
    depends_on:
      - flourish-backend
    ports:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.flourishideas.com
    networks:
      - flourish-network

volumes:
  postgres_data:

networks:
  flourish-network:
    external: true
